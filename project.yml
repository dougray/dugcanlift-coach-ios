# Coach — XcodeGen project definition
#
# Regenerate Coach.xcodeproj with:  xcodegen generate   (or: make project)
# The .xcodeproj is a build artifact — it is gitignored. This file is the
# source of truth for targets, entitlements, capabilities and Info.plist keys.

name: Coach

packages:
  # Pinned to an exact tag, not a range: a change here reaches two shipped
  # apps at once, and `@Model` types are shared, so a property change in the
  # package is a schema change for both. Upgrading is a deliberate edit to
  # this line, never something that happens on a `swift package update`.
  LiftKit:
    url: https://github.com/dougray/dugcanlift-kit
    exactVersion: 1.2.1

options:
  bundleIdPrefix: com.dugcanlift
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "QG57FJM5C8"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # SwiftData @Model classes are not Sendable. `complete` buries real errors
    # under concurrency warnings during scaffolding — tighten once it builds.
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"   # iPhone only

targets:

  # ---------------------------------------------------------------- app
  Coach:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: LiftKit
        product: LiftCore
      - package: LiftKit
        product: LiftReference
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dugcanlift.coach
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Config/Coach-Info.plist
      properties:
        # An empty UILaunchScreen is what tells iOS this app is built for
        # modern screens. Without the key, iOS runs it in compatibility mode
        # -- letterboxed, with black bands above and below, using neither the
        # full height of the display nor the safe areas around the notch.
        #
        # INFOPLIST_KEY_UILaunchScreen_Generation: YES was already set in
        # `settings` and did nothing: that build setting only applies when
        # Xcode generates the Info.plist, and this target supplies its own.
        UILaunchScreen: {}
        CFBundleDisplayName: Coach
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

  # --------------------------------------------------------------- tests
  CoachTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Coach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dugcanlift.coach.tests
        # Without this the test bundle has no Info.plist and code signing
        # fails, so `make test` never gets as far as running anything.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Coach:
    build:
      targets:
        Coach: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CoachTests
    archive:
      config: Release
