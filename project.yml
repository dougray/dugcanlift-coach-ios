# Coach — XcodeGen project definition
#
# Regenerate Coach.xcodeproj with:  xcodegen generate   (or: make project)
# The .xcodeproj is a build artifact — it is gitignored. This file is the
# source of truth for targets, entitlements, capabilities and Info.plist keys.

name: Coach

packages:
  # Pinned to an exact tag, not a range: a change here reaches two shipped
  # apps at once, and `@Model` types are shared, so a property change in the
  # package is a schema change for both. Upgrading is a deliberate edit to
  # this line, never something that happens on a `swift package update`.
  LiftKit:
    url: https://github.com/dougray/dugcanlift-kit
    exactVersion: 1.10.0

options:
  bundleIdPrefix: com.dugcanlift
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "QG57FJM5C8"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # SwiftData @Model classes are not Sendable. `complete` buries real errors
    # under concurrency warnings during scaffolding — tighten once it builds.
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # iPhone and iPad. Layout follows the width a window actually has (see
    # "Large screens" in CLAUDE.md), so an iPad in Split View or Stage Manager
    # gets the iPhone layout when it is narrow and nothing here needs
    # UIRequiresFullScreen -- leaving it unset is what allows multitasking.
    TARGETED_DEVICE_FAMILY: "1,2"

targets:

  # ---------------------------------------------------------------- app
  Coach:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
      # Includes PrivacyInfo.xcprivacy, the App Store privacy manifest. It
      # must land at the root of Coach.app, which a resources build phase
      # over this folder does -- check with
      # `ls .build/DerivedData/Build/Products/Debug-iphonesimulator/Coach.app`.
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: LiftKit
        product: LiftCore
      - package: LiftKit
        product: LiftReference
      # Embedded in Coach.app/PlugIns.
      - target: CoachShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dugcanlift.coach
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: Config/Coach.entitlements
      properties:
        # The share extension's hand-off (PendingShareLinks). App Groups sign
        # on a free Personal Team -- lift-ios's widget ships with one, and its
        # free-team entitlements file keeps it -- unlike Associated Domains,
        # which is why there are still no Universal Links here.
        com.apple.security.application-groups:
          - group.com.dugcanlift.coach
    info:
      path: Config/Coach-Info.plist
      properties:
        # An empty UILaunchScreen is what tells iOS this app is built for
        # modern screens. Without the key, iOS runs it in compatibility mode
        # -- letterboxed, with black bands above and below, using neither the
        # full height of the display nor the safe areas around the notch.
        #
        # INFOPLIST_KEY_UILaunchScreen_Generation: YES was already set in
        # `settings` and did nothing: that build setting only applies when
        # Xcode generates the Info.plist, and this target supplies its own.
        UILaunchScreen: {}
        CFBundleDisplayName: Coach
        # Coach uses only the encryption built into iOS (HTTPS for Cook's two
        # imports). Declaring it here answers App Store Connect's export
        # compliance question once, instead of on every upload.
        ITSAppUsesNonExemptEncryption: false
        # All four on iPad, which Split View and Stage Manager require. iPhone
        # has no key, as before, so its orientations are unchanged.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # dugcanliftcoach://import#1z... opens Coach and imports the log, the
        # same as Paste a Link (RootView.onOpenURL). A custom scheme needs no
        # entitlement, so it works on a free team where Universal Links don't.
        CFBundleURLTypes:
          - CFBundleURLName: com.dugcanlift.coach.import
            CFBundleURLSchemes:
              - dugcanliftcoach

  # ------------------------------------------------------ share extension
  # "Coach" in the share sheet for a LIFT log link shared from Safari,
  # Messages, Mail or Notes. It decodes the link to confirm who it is from,
  # then queues the fragment in the App Group for the app to import on its
  # next foreground -- see PendingShareLinks for why it does not open the app
  # or write to SwiftData itself.
  CoachShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/ShareExtension
      # Only what the extension needs from Shared: no SwiftData, no views.
      - path: Sources/Shared/ShareLinkExtractor.swift
      - path: Sources/Shared/PendingShareLinks.swift
    dependencies:
      # LiftCore only. LiftReference's GRDB and 2.3 MB of databases have no
      # business in a share sheet with a tight memory limit.
      - package: LiftKit
        product: LiftCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dugcanlift.coach.share
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: Config/CoachShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dugcanlift.coach
    info:
      path: Config/CoachShare-Info.plist
      properties:
        CFBundleDisplayName: Coach
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # A web URL (Safari, Messages' link previews) or text (Notes, Mail,
            # a message body) -- a link can arrive as either. Text means Coach
            # is offered for any text; the extension says plainly when it
            # isn't a LIFT link.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true

  # --------------------------------------------------------------- tests
  CoachTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Tests/Fixtures
        buildPhase: resources
      # road-food.json is checked against the ids a real plan link carries, so
      # the test bundle needs the same copy the app ships rather than a
      # fixture of its own.
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: Coach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dugcanlift.coach.tests
        # Without this the test bundle has no Info.plist and code signing
        # fails, so `make test` never gets as far as running anything.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Coach:
    build:
      targets:
        Coach: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CoachTests
    archive:
      config: Release
