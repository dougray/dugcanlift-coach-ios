# Coach — XcodeGen project definition
#
# Regenerate Coach.xcodeproj with:  xcodegen generate   (or: make project)
# The .xcodeproj is a build artifact — it is gitignored. This file is the
# source of truth for targets, entitlements, capabilities and Info.plist keys.

name: Coach

packages:
  LiftKit:
    path: ../dugcanlift-kit

options:
  bundleIdPrefix: com.dugcanlift
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "QG57FJM5C8"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # SwiftData @Model classes are not Sendable. `complete` buries real errors
    # under concurrency warnings during scaffolding — tighten once it builds.
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"   # iPhone only

targets:

  # ---------------------------------------------------------------- app
  Coach:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: LiftKit
        product: LiftCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dugcanlift.coach
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Config/Coach-Info.plist
      properties:
        CFBundleDisplayName: Coach
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

  # --------------------------------------------------------------- tests
  CoachTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Coach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dugcanlift.coach.tests
        # Without this the test bundle has no Info.plist and code signing
        # fails, so `make test` never gets as far as running anything.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Coach:
    build:
      targets:
        Coach: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CoachTests
    archive:
      config: Release
